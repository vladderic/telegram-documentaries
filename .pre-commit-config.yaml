# All repository checks, run in order via `scripts/hooks`
# (equivalently: `pre-commit run --all-files`) or automatically on commit
# after `pre-commit install`.
#
# 1. ruff (lint)   2. ruff-format   3. mypy   4. pytest   5. gitleaks
#
# The ruff rev MUST match the ruff pin in pyproject.toml so the hook and a
# local `ruff check .` agree.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
      - id: ruff-format

  # Local hooks: mypy must resolve the project's own dependencies (httpx,
  # pydantic, ...) and its pyproject.toml config, which an isolated mirror
  # environment would not have. pytest is the ground-truth dev script (TECH.md).
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: bash scripts/test
        language: system
        pass_filenames: false

  # Official gitleaks mirror - pre-commit auto-installs the gitleaks binary,
  # so it never needs to be present on the system.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
