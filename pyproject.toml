[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-documentaries"
version = "0.1.0"
description = "Telegram bot that turns your portrait photo into a narrated comedy wildlife documentary."
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies, pinned for reproducibility (TECH.md).
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
# Dev tooling, pinned for reproducibility (TECH.md). Install with:
#   pip install -e ".[dev]"
dev = [
    "mypy==2.3.0",
    "pre-commit==4.6.1",
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# ruff (lint)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

# ---------------------------------------------------------------------------
# ruff format
# ---------------------------------------------------------------------------
[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
strict_equality = true
show_error_codes = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers", "-ra"]
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as asyncio",
]
